<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gallery | Mody Spring Works</title>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <div id="site-header-mount"></div>
  <section class="page-banner">
    <div class="container">
      <h1>Gallery</h1>
      <p>A look at our springs, components, and manufacturing setup</p>
    </div>
  </section>
  <section class="section">
    <div class="container gallery-grid">
      <img src="/images/compression.jpg" alt="Compression springs" />
      <img src="/images/tension.jpg" alt="Tension springs" />
      <img src="/images/conical.jpg" alt="Conical springs" />
      <img src="/images/torsion.jpg" alt="Torsion springs" />
      <img src="/images/wireforms.jpg" alt="Wireforms" />
      <img src="/images/touch-sensor.jpg" alt="Touch sensor springs" />
      <img src="/images/barrel.jpg" alt="Barrel springs" />
      <img src="/images/r-pins.jpg" alt="R-Pins" />
      <img src="/images/valve-plate.jpg" alt="Valve plates" />
      <img src="/images/gallery1.jpg" alt="Manufacturing" />
      <img src="/images/machine.jpg" alt="Spring machine" />
      <img src="/images/industrial.avif" alt="Industrial springs" onerror="this.src='/images/gallery1.jpg'" />
    </div>
  </section>
  <div id="site-footer-mount"></div>
  <script src="/js/site.js"></script>
  <script src="/js/chatbot.js"></script>
</body>
</html>
